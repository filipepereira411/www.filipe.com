<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Filipe</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="auth-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Filipe<span aria-hidden="true">.</span></a>
      <a class="auth-back" href="index.html">← Voltar ao site</a>
    </div>
  </header>

  <main class="auth-main" id="conteudo">
    <section class="auth-card">
      <header class="auth-head">
        <p class="eyebrow">Área do cliente</p>
        <h1>Entrar</h1>
        <p>Acesse a sua conta para acompanhar pedidos e atendimentos.</p>
      </header>

      <form class="auth-form" id="form-login" novalidate>
        <div class="field">
          <label for="identificador">E-mail ou utilizador</label>
          <input id="identificador" name="identificador" type="text"
                 autocomplete="username" required placeholder="voce@email.com">
        </div>

        <div class="field">
          <div class="label-row">
            <label for="senha">Senha</label>
            <a class="field-link" href="esqueci.html">Esqueci a senha</a>
          </div>
          <input id="senha" name="senha" type="password"
                 autocomplete="current-password" required placeholder="••••••••">
        </div>

        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        <p class="form-status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Ainda não tem conta? <a href="registo.html">Criar conta</a></p>

      <p class="demo-hint">
        <strong>Demonstração:</strong> admin — utilizador <code>admin</code>, senha <code>admin</code>.
      </p>
    </section>
  </main>

  <script src="js/auth.js" defer></script>
</body>
</html>
