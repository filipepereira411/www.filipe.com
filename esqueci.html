<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar senha — Filipe</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="auth-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Filipe<span aria-hidden="true">.</span></a>
      <a class="auth-back" href="index.html">← Voltar ao site</a>
    </div>
  </header>

  <main class="auth-main" id="conteudo">
    <section class="auth-card">
      <header class="auth-head">
        <p class="eyebrow">Recuperação</p>
        <h1>Esqueci a senha</h1>
        <p>Informe o e-mail da sua conta e geraremos um link para criar uma nova senha.</p>
      </header>

      <form class="auth-form" id="form-esqueci" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
        </div>

        <button class="btn btn-primary btn-block" type="submit">Gerar link de recuperação</button>
        <p class="form-status" id="status" role="status" aria-live="polite"></p>
        <div class="demo-link" id="demo-link" hidden></div>
      </form>

      <p class="auth-switch"><a href="login.html">← Voltar para o login</a></p>

      <p class="demo-hint">
        <strong>Modo demonstração:</strong> não há envio de e-mail. O link de redefinição
        aparece aqui na tela e no terminal do servidor.
      </p>
    </section>
  </main>

  <script src="js/auth.js" defer></script>
</body>
</html>
