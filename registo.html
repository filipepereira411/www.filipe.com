<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Filipe</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="auth-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Filipe<span aria-hidden="true">.</span></a>
      <a class="auth-back" href="index.html">← Voltar ao site</a>
    </div>
  </header>

  <main class="auth-main" id="conteudo">
    <section class="auth-card">
      <header class="auth-head">
        <p class="eyebrow">Área do cliente</p>
        <h1>Criar conta</h1>
        <p>É rápido. Depois de criar, você já entra direto na sua área.</p>
      </header>

      <form class="auth-form" id="form-registo" novalidate>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" autocomplete="name" required placeholder="Seu nome">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com">
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password"
                 minlength="6" required placeholder="Mínimo de 6 caracteres">
        </div>

        <div class="field">
          <label for="confirmar">Confirmar senha</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password"
                 minlength="6" required placeholder="Repita a senha">
        </div>

        <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
        <p class="form-status" id="status" role="status" aria-live="polite"></p>
      </form>

      <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
  </main>

  <script src="js/auth.js" defer></script>
</body>
</html>
